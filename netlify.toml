# Netlify build config for Claudia (Next.js 16 App Router: SSR, server actions,
# middleware). The official Next.js runtime plugin handles routing/functions and
# sets the publish directory itself. Pin Node to a version Netlify + Next 16
# support. All secrets come from the Netlify UI env vars, never this file.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secret scanner flags any env-var value it finds in the build output.
  # All three Supabase values legitimately appear there:
  #   - the two NEXT_PUBLIC_* values are public by design (they ship to the browser);
  #   - SUPABASE_SERVICE_ROLE_KEY is injected by Netlify's Next runtime into the
  #     SERVER + edge function bundles so the server can use it at runtime. It is
  #     NOT in any client/browser bundle (verified), so site visitors never get it.
  # `src/lib/supabase.ts` also carries `import 'server-only'`, so the build fails if
  # that client-forbidden module is ever pulled into browser code. Excluding these
  # three keys still leaves scanning on for any OTHER secret.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
